# 独立项目与数据卷：不会接管原 lma 项目的 Agent Server、Redis 或 lma_pgdata。
name: lma-oss

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lma
      POSTGRES_USER: lma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须配置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - oss_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lma -d lma"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m

  migrate:
    image: lma-backend:${LMA_RELEASE:-local}
    build: &backend-build
      context: ./backend
      args:
        PIP_INDEX_URL: ${LMA_PIP_INDEX_URL:-https://pypi.org/simple}
    env_file: ${LMA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_URI: postgresql://lma:${POSTGRES_PASSWORD}@postgres:5432/lma
    command: ["python", "-m", "app.server.storage"]
    depends_on:
      postgres:
        condition: service_healthy

  lma-agent:
    image: lma-backend:${LMA_RELEASE:-local}
    build: *backend-build
    restart: unless-stopped
    env_file: ${LMA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_URI: postgresql://lma:${POSTGRES_PASSWORD}@postgres:5432/lma
    ports:
      - "127.0.0.1:2025:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m

  frontend:
    image: lma-frontend:${LMA_RELEASE:-local}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      lma-agent:
        condition: service_healthy
    mem_limit: 96m

volumes:
  oss_pgdata:
