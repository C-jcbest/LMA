# 开发、论文演示与小规模自托管验证：Nginx + LangGraph Server + PostgreSQL + Redis
# 本文件不是高可用、弹性伸缩或完整 production-grade 部署方案；详见 docs/deployment.md。
#
# 部署流程（项目根目录执行）：
#   cd backend
#   langgraph build -t lma-agent:latest     # 生成生产镜像（自动安装 requirements.txt）
#   cd ..
#   docker compose --env-file backend/.env up -d --build
#
# 注意：${POSTGRES_PASSWORD} 变量插值需要 --env-file backend/.env（compose 默认只读根目录 .env）；
# env_file 同样指向 backend/.env，保证容器内凭据与插值密码同源。
#
# 浏览器统一访问 http://127.0.0.1:8080；Nginx 将 /langgraph-api 同源代理到 Agent Server。
# 开发链路不受影响：backend/ 下 langgraph dev + frontend/ 下 pnpm run dev。
#
# 数据持久：Postgres 数据落在 named volume lma_pgdata，
# docker compose down / restart / 机器重启后会话历史（threads、checkpoints）均保留；
# 彻底清除数据需 docker compose down -v。
#
# 凭据安全：LLM/北斗/视觉等密钥通过 env_file: backend/.env 运行时注入，
# 不会被烘焙进镜像；POSTGRES_PASSWORD 从同一 .env 读取。
#
# Redis 说明：langgraph-api 0.14.x（Go core server 架构）强制要求 REDIS_URI，
# 即使单实例部署也需提供，用于流式事件 pub/sub 与后台任务队列；
# 数据不落盘（仅消息队列，持久化全部在 Postgres），重启不丢会话。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lma
      POSTGRES_USER: lma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 backend/.env 中设置 POSTGRES_PASSWORD}
    volumes:
      - lma_pgdata:/var/lib/postgresql/data # 数据落盘，容器重建不丢
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lma -d lma"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lma-agent:
    image: lma-agent:latest # 由 langgraph build 产出
    env_file: backend/.env # 运行时注入 LLM/北斗/视觉凭据（不烘焙进镜像）
    environment:
      DATABASE_URI: postgresql://lma:${POSTGRES_PASSWORD}@postgres:5432/lma?sslmode=disable
      REDIS_URI: redis://redis:6379
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:?请在 backend/.env 中设置 LANGSMITH_API_KEY}
      LANGGRAPH_CLOUD_LICENSE_KEY: ${LANGGRAPH_CLOUD_LICENSE_KEY:?请在 backend/.env 中设置 LANGGRAPH_CLOUD_LICENSE_KEY}
    ports:
      - "2024:8000" # 容器 8000 → 宿主机 2024，前端默认地址不变
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ok', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      lma-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  lma_pgdata:
