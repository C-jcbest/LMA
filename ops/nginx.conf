# 安装到 /etc/nginx/sites-available/lma，将 SERVER_IP 替换为服务器公网 IP。
server {
    listen 80;
    server_name SERVER_IP;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lma-acme;
    }
    location / { return 308 https://SERVER_IP$request_uri; }
}

server {
    listen 443 ssl;
    server_name SERVER_IP;
    ssl_certificate /etc/letsencrypt/live/SERVER_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    # 访问保护由应用登录页负责（AUTH_PASSWORD），网关不再使用 Basic Auth。

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
